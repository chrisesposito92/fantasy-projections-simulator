name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: |
          uv run --python ${{ matrix.python-version }} python -m pytest tests/ \
            -m "not integration and not statistical" \
            --tb=short \
            -q \
            --no-header

  test-statistical:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'run-statistical-tests')
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --dev --python 3.14

      - name: Run statistical tests
        run: |
          uv run --python 3.14 python -m pytest tests/ \
            -m "statistical" \
            --tb=short \
            -q \
            --no-header
