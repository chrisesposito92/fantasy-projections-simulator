# config/defaults.yaml
simulation:
  num_sims: 1000
  training_years: 3
  historical_seasons: [2022, 2023, 2024]
  recency_weights: [0.2, 0.3, 0.5]
  rookie_blend_games: 4

scoring:
  ppr:
    passing_yard: 0.04
    passing_td: 4
    interception: -2
    rushing_yard: 0.1
    rushing_td: 6
    reception: 1
    receiving_yard: 0.1
    receiving_td: 6
    fumble_lost: -2
    two_point: 2
    fg_0_39: 3
    fg_40_49: 4
    fg_50_plus: 5
    xp_made: 1
    fg_miss: -1
    dst_sack: 1
    dst_interception: 2
    dst_fumble_recovery: 2
    dst_td: 6
    dst_safety: 2
    dst_points_allowed_0: 10
    dst_points_allowed_1_6: 7
    dst_points_allowed_7_13: 4
    dst_points_allowed_14_20: 1
    dst_points_allowed_21_27: 0
    dst_points_allowed_28_34: -1
    dst_points_allowed_35_plus: -4
  half_ppr:
    _inherit: ppr
    reception: 0.5
  standard:
    _inherit: ppr
    reception: 0

positions:
  qb:
    min_snaps: 200
  rb:
    min_carries: 30
    min_targets: 10
  wr:
    min_targets: 30
  te:
    min_targets: 20
  k: {}
  dst: {}

pff:
  enabled: true
  data_dir: null  # defaults to ~/.fantasy-sim/pff/processed/nfl/

  tier_engine:
    enabled: true
    cutoffs: [0.85, 0.65, 0.40, 0.20]
    position_grades:
      QB:
        primary: grades_pass
        secondary: accuracy_percent
      RB:
        primary: grades_run
        secondary: elusive_rating
      WR:
        primary: grades_pass_route
        secondary: _disabled
      TE:
        primary: grades_pass_route
        secondary: recv_grade
    reliability_max_games: 32
    reliability_team_change_penalty: 0.5
    reliability_variance_weight: 0.3
    reliability_floor: 0.20
    reliability_cap: 0.80
    blend_pool_size: 250
    ncaa_rookie:
      enabled: true
      draft_confidence:
        1: 1.0
        2: 0.95
        3: 0.85
        4: 0.75
        5: 0.65
        6: 0.55
        7: 0.50
      undrafted_confidence: 0.40
      ncaa_lookback_seasons: 4
    archetypes:
      enabled: true
      n_archetypes: 3
      adot_grade_key: avg_depth_of_target
      min_archetype_pool_size: 10

  team_context:
    enabled: false
    pass_rate_sensitivity: 0.0
    ol_run_sensitivity: 0.06
    qb_quality_sensitivity: 0.05
    factor_clamp: [0.90, 1.10]
    min_games: 4
    ol_run_yards_scale: 10.0

  matchup:
    enabled: true
    pass_defense_sensitivity: 0.06
    pass_rush_sensitivity: 0.075
    run_defense_sensitivity: 0.06
    int_rate_sensitivity: 0.045
    ol_pass_sensitivity: 0.06
    ol_run_sensitivity: 0.045
    factor_clamp: [0.90, 1.10]
    min_games: 4

  talent:
    enabled: false
    prior_strength: 30
    min_divergence: 0.01
    team_change_factor: 0.5
    catch_rate_coefficients:
      drop_rate: 0.21
      contested_catch_rate: -0.25
      qb_accuracy: 0.03
    rushing_yards_coefficients:
      yco_attempt: 0.02
      elusive_rating: 0.0005
    receiving_yards_coefficients:
      yprr: 0.43
      avg_depth_of_target: 0.41
    target_share_coefficients:
      route_grade: 0.5
      yprr: 0.3
    fumble_rate_coefficients:
      grades_hands_fumble: -0.002
    scramble_rate_enabled: true
    schedule_adjustment:
      enabled: true
      weight: 0.3
      catch_rate_sensitivity: 0.005
      rush_yards_sensitivity: 0.3
    ncaa_priors:
      enabled: true
      draft_weight: 0.6
      ncaa_data_dir: null
