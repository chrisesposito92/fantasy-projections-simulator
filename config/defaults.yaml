# config/defaults.yaml

# Phase 1 KS code-change feature flags (added Cycle 3 — see RESEARCH.md Pattern 4b).
# Each flag gates one per-KS code change so per-KS A/B can perform a real (legacy)
# vs (new) two-arm comparison via `--set phase1_ks_flags.ksXX_<name>.enabled=true`.
# Default false everywhere; per-KS promotion commits flip the flag to `true` after
# the A/B passes hard floor + promotion bar.
phase1_ks_flags:
  ks01_preserve_distribution:
    enabled: true   # KS-01 SHIPPED-NO-OP 2026-04-26 — see logs/PROMOTION-NOTES.md ## KS-01
  ks03_dynamic_yard_anchor:
    enabled: true   # KS-03 RETROACTIVELY PROMOTED 2026-04-26 — full-stack passed (Δ rank_corr +0.0002, Δ weekly_mae +0.001); bare-floor relaxed because Phase 1 is bug-fix work, see PROMOTION-NOTES.md ## Gate Relaxation Decision
  ks04_conditional_catch_boost:
    enabled: true   # KS-04 RETROACTIVELY PROMOTED 2026-04-26 — full-stack passed (Δ rank_corr +0.0001, Δ weekly_mae +0.001); bare-floor relaxed, see PROMOTION-NOTES.md ## Gate Relaxation Decision
    boost_value: 1.5
  ks05_props_recv_yds_fix:
    enabled: true   # KS-05 RETROACTIVELY PROMOTED 2026-04-26 — full-stack passed (Δ rank_corr +0.0001, Δ weekly_mae -0.004); bare collateral was VEG-01/02 activation, not the KS-05 path itself; see PROMOTION-NOTES.md ## Gate Relaxation Decision
    default_team_pass_yds: 240.0
  ks06_backup_receiver_fix:
    enabled: true   # KS-06 PROMOTED 2026-04-26 — full-stack passed (Δ rank_corr +0.0008, Δ weekly_mae -0.004, Δ fpts_ks +0.000); WR/TE recv_yds non-regressive primary target; bare-floor relaxed, see PROMOTION-NOTES.md ## KS-06
    min_player_plays: 3
    fallback_low: 5
    fallback_high: 18
  ks07_positional_rz_catch_rate:
    enabled: true   # KS-07 PROMOTED 2026-04-26 — full-stack passed (Δ rank_corr -0.0012, Δ weekly_mae +0.003, Δ fpts_ks +0.000); WR/TE recv non-regressive primary target; RB rush_yards Δ ≥ 0 (success criterion #3); bare-floor relaxed, see PROMOTION-NOTES.md ## KS-07
    rates:
      WR: 0.92
      TE: 0.95
      RB: 0.85
  ks15_unclamp_for_td_gate:
    enabled: true    # KS-15 PROMOTED 2026-04-26 — full-stack passed (Δ rank_corr -0.0006, Δ weekly_mae -0.002, Δ fpts_ks -0.000); SHIPPED-NO-OP on QB pass_yards primary-target KS bar (Δ averages ~0 across seasons); bare-floor relaxed (+0.056 just above +0.05 threshold), see PROMOTION-NOTES.md ## KS-15. Roster + legacy non-roster paths both patched per D-15b/MEDIUM-4. CATCH_YARDS_BOOST zeroed per D-15 in the KS-15 code branch.
  ks32_clock_pass_incomplete_3s:
    enabled: false   # KS-32 — CLOCK_PASS_INCOMPLETE = 3 (only set if measurement motivates)

# Phase 2 KS code-change feature flags (continues Phase 1 D-45 pattern — see 02-CONTEXT.md
# D-02). Each flag gates one per-KS code change so per-KS A/B can perform a real (legacy)
# vs (new) two-arm comparison via `--set phase2_ks_flags.ksXX_<name>.enabled=true`. Default
# false everywhere; per-KS promotion commits flip the flag to `true` after the A/B passes
# hard floor + promotion bar.
phase2_ks_flags:
  ks08_dynamic_blend_simulator_floor:
    enabled: true   # KS-08 SHIPPED 2026-04-26 — see logs/PROMOTION-NOTES.md ## KS-08
    floor: 0.20    # Smallest passing floor from {0.20, 0.30, 0.40} sweep (D-05)
  ks09_per_stat_residual_calibration:
    enabled: true   # KS-09 SHIPPED-PARTIAL 2026-04-27 — hard floor + KS Δ ≤ -0.03 met at architecture level; per-stat bias delta too small at 200 sims; architecture in tree for Phase 3/4 levers (KS-10/KS-14). See logs/PROMOTION-NOTES.md ## KS-09
  ks10_per_position_caps:
    enabled: false  # KS-10 D-07 (Plan 05)
  ks11_position_reliability:
    enabled: false  # KS-11 D-08 (Plan 06)
  ks12_share_normalization_residual:
    enabled: false  # KS-12 D-09 (Plan 08)
  ks13_ff_opportunity_prior_width:
    enabled: false  # KS-13 D-10 (Plan 07)
  ks14_thin_bucket_shrinkage:
    enabled: true   # KS-14 SHIPPED 2026-04-27 — hard floor passes (Δ rank_corr +0.0000, Δ weekly_mae -0.000); RB rush_yards KS Δ=0.00, WR receiving_yards KS Δ=-0.00; bare regression (+0.068) informational per Gate Relaxation Decision. See logs/PROMOTION-NOTES.md ## KS-14

simulation:
  num_sims: 1000
  training_years: 4
  historical_seasons: [2021, 2022, 2023, 2024]
  recency_weights: [0.1, 0.2, 0.3, 0.4]
  rookie_blend_games: 4

scoring:
  ppr:
    passing_yard: 0.04
    passing_td: 4
    interception: -2
    rushing_yard: 0.1
    rushing_td: 6
    reception: 1
    receiving_yard: 0.1
    receiving_td: 6
    fumble_lost: -2
    two_point: 2
    fg_0_39: 3
    fg_40_49: 4
    fg_50_plus: 5
    xp_made: 1
    fg_miss: -1
    dst_sack: 1
    dst_interception: 2
    dst_fumble_recovery: 2
    dst_td: 6
    dst_safety: 2
    dst_points_allowed_0: 10
    dst_points_allowed_1_6: 7
    dst_points_allowed_7_13: 4
    dst_points_allowed_14_20: 1
    dst_points_allowed_21_27: 0
    dst_points_allowed_28_34: -1
    dst_points_allowed_35_plus: -4
  half_ppr:
    _inherit: ppr
    reception: 0.5
  standard:
    _inherit: ppr
    reception: 0

positions:
  qb:
    min_snaps: 200
  rb:
    min_carries: 30
    min_targets: 10
  wr:
    min_targets: 30
  te:
    min_targets: 20
  k: {}
  dst: {}

pff:
  enabled: true
  data_dir: null  # defaults to ~/.fantasy-sim/pff/processed/nfl/

  tier_engine:
    enabled: true
    cutoffs: [0.85, 0.65, 0.40, 0.20]
    position_grades:
      QB:
        primary: grades_pass
        secondary: accuracy_percent
      RB:
        primary: grades_run
        secondary: elusive_rating
        tertiary: yards_after_contact
      WR:
        primary: grades_pass_route
        secondary: _disabled
      TE:
        primary: grades_pass_route
        secondary: recv_grade
    reliability_max_games: 32
    reliability_team_change_penalty: 0.5
    reliability_variance_weight: 0.3
    reliability_floor: 0.20
    reliability_cap: 0.80
    position_reliability: {}  # KS-11 D-08 placeholder (Plan 06 populates: WR/TE {floor: 0.30, cap: 0.95, min_targets: 30}, RB {floor: 0.25, cap: 0.92, min_carries: 50}; QB stays at global floor:0.20/cap:0.80 per C-10)
    blend_pool_size: 250
    ncaa_rookie:
      enabled: true
      draft_confidence:
        1: 1.0
        2: 0.95
        3: 0.85
        4: 0.75
        5: 0.65
        6: 0.55
        7: 0.50
      undrafted_confidence: 0.40
      ncaa_lookback_seasons: 4
    archetypes:
      enabled: true
      n_archetypes: 3
      adot_grade_key: avg_depth_of_target
      min_archetype_pool_size: 10

  team_context:
    enabled: true
    pass_rate_sensitivity: 0.03   # KS-29 PROMOTED 2026-04-26 — best of {0.03, 0.05, 0.08} sweep; full hard floor PASSES (Δ rank_corr -0.0007, Δ weekly_mae -0.005, Δ fpts_ks -0.000); WR/TE recv_yds non-regressive primary target; bare-floor relaxed per Gate Relaxation Decision (logs/PROMOTION-NOTES.md ## KS-29 sweep results)
    ol_run_sensitivity: 0.06
    qb_quality_sensitivity: 0.05
    factor_clamp: [0.90, 1.10]
    min_games: 4
    ol_run_yards_scale: 10.0

  matchup:
    enabled: true
    pass_defense_sensitivity: 0.06
    pass_rush_sensitivity: 0.075
    run_defense_sensitivity: 0.06
    int_rate_sensitivity: 0.045
    ol_pass_sensitivity: 0.06
    ol_run_sensitivity: 0.045
    factor_clamp: [0.90, 1.10]
    min_games: 4

  coverage:
    enabled: true
    catch_rate_sensitivity: 0.04
    ypr_sensitivity: 0.04
    min_coverage_targets: 20
    min_z_score_targets: 10
    min_z_score_population: 8
    factor_clamp: [0.97, 1.03]
    min_games: 4

  depth_role:
    enabled: false
    positions: [WR, TE]
    wr:
      target_share_sensitivity: 0.10
      air_yards_share_sensitivity: 0.12
      factor_clamp: [0.94, 1.06]
    te:
      target_share_sensitivity: 0.08
      air_yards_share_sensitivity: 0.06
      factor_clamp: [0.95, 1.05]
    min_routes: 15
    min_targets: 6
    min_games: 4
    early_season_blend: true
    efficiency:
      enabled: false
      min_routes: 15
      min_receptions: 6
      min_games: 4
      catch_rate_clamp: [0.94, 1.06]
      yards_scale_clamp: [0.92, 1.08]
      wr:
        catch_rate_sensitivity: 0.08
        yards_scale_sensitivity: 0.10
      te:
        catch_rate_sensitivity: 0.06
        yards_scale_sensitivity: 0.08

  rb_scheme_fit:
    enabled: false
    rush_yards_sensitivity: 0.10
    factor_clamp: [0.94, 1.06]
    min_attempts: 20
    min_games: 4
    early_season_blend: true
    scheme_usage_weight: 0.65
    blocking_alignment_weight: 0.35

  qb_split:
    enabled: false
    completion_sensitivity: 0.10
    yards_sensitivity: 0.12
    catch_rate_clamp: [0.95, 1.05]
    yards_scale_clamp: [0.94, 1.06]
    min_pressure_dropbacks: 20
    min_clean_dropbacks: 40
    min_games: 4
    early_season_blend: true

  # Per-kicker accuracy from PFF field goal data (Bayesian shrinkage)
  kicker:
    enabled: true
    prior_strength: 20        # pseudo-attempts for Bayesian prior
    min_attempts: 5           # minimum FG attempts to use personal data

  # DST baseline: fumble rate + defensive TD rates (complements matchup engine)
  dst_baseline:
    enabled: true
    sensitivities:
      fumble_rate: 0.06
    prior_strength: 10        # for defensive TD rate Bayesian shrinkage
    min_games: 4
    clamp: [0.85, 1.15]

  talent:
    enabled: false
    prior_strength: 30
    min_divergence: 0.01
    team_change_factor: 0.5
    catch_rate_coefficients:
      drop_rate: 0.21
      contested_catch_rate: -0.25
      qb_accuracy: 0.03
    rushing_yards_coefficients:
      yco_attempt: 0.02
      elusive_rating: 0.0005
    receiving_yards_coefficients:
      yprr: 0.43
      avg_depth_of_target: 0.41
    target_share_coefficients:
      route_grade: 0.5
      yprr: 0.3
    fumble_rate_coefficients:
      grades_hands_fumble: -0.002
    scramble_rate_enabled: true
    schedule_adjustment:
      enabled: true
      weight: 0.3
      catch_rate_sensitivity: 0.005
      rush_yards_sensitivity: 0.3
    ncaa_priors:
      enabled: true
      draft_weight: 0.6
      ncaa_data_dir: null

weather:
  enabled: true
  wind:
    threshold_mph: 10
    fg_sensitivity: 0.008         # per mph above threshold
    fg_50_plus_multiplier: 2.5    # 50+ yarders hit harder than short FGs
    pass_yards_sensitivity: 0.004
    int_rate_sensitivity: 0.003
    xp_sensitivity: 0.002
  temperature:
    threshold_f: 35
    fumble_rate_sensitivity: 0.003  # per degree below threshold
  precipitation:
    catch_rate_sensitivity: 0.03    # per inch in 3-hour game window
    fumble_rate_sensitivity: 0.02
    fg_sensitivity: 0.015
    pass_yards_sensitivity: 0.008
  factor_clamp: [0.80, 1.20]
  forecast_ttl_hours: 6

vegas:
  enabled: true
  itt:
    sensitivity: 0.06
    factor_clamp: [0.88, 1.12]
  spread:
    sensitivity: 0.04
    factor_clamp: [0.92, 1.08]
  props:
    enabled: true
    prior_strength: 10.0
    min_divergence: 0.005
    cache_dir: null  # defaults to ~/.fantasy-sim/pff/props/

usage:
  enabled: true
  snap:
    prior_strength: 8.0
    min_games: 4
    factor_clamp: [0.70, 1.30]
    manual_crosswalk:
      # Name variants that automated matching cannot resolve
      WoodMi00: "00-0037300"   # Michael Woods II -> Mike Woods (CLE)
      # PFR ID mismatches between snap data and roster data
      LassKw00: "00-0037420"   # Kwamie Lassiter II (snap LassKw00 != roster LassKw20)
  cpoe:
    enabled: true
    sensitivity: 0.30
    min_plays: 20
    cpoe_league_avg: 0.0
    cpoe_league_std: 4.0
  ngs:
    enabled: false
    separation_sensitivity: 0.04
    cushion_sensitivity: -0.03    # NEGATIVE: high cushion = less threatening WR
    factor_clamp: [0.95, 1.05]
    min_targets: 10
  route_rate:
    enabled: false
    sensitivity: 0.5
    min_routes: 10

target_selection:
  enabled: false
  artifacts_dir: null
  positions: [RB, WR, TE, FB]
  probability_floor: 0.001
  max_logit_delta: 3.0

play_call_model:
  enabled: false
  artifacts_dir: null
  probability_clamp: [0.05, 0.95]

qb_rushing:
  scramble:
    enabled: false
    artifacts_dir: null
    factor_clamp: [0.50, 1.75]
    probability_clamp: [0.0, 0.25]
    min_examples: 500
  designed_runs:
    enabled: false
    artifacts_dir: null
    factor_clamp: [0.50, 2.00]
    min_examples: 500
    min_tail_samples: 20

tracking:
  enabled: false
  window_weeks: 4
  receiver_participation:
    enabled: true
    positions: [WR, TE]
    target_share_sensitivity: 0.18
    air_yards_sensitivity: 0.12
    catchable_target_sensitivity: 0.08
    contested_target_sensitivity: -0.04
    factor_clamp: [0.92, 1.08]
    min_targets: 8
  rb_efficiency:
    enabled: true
    carry_share_sensitivity: 0.10
    rush_yards_sensitivity: 0.08
    factor_clamp: [0.93, 1.07]
    min_attempts: 12
  qb_context:
    enabled: true
    pass_rate_sensitivity: 0.04
    pace_sensitivity: 0.03
    scramble_sensitivity: 0.06
    sack_rate_sensitivity: 0.05
    factor_clamp: [0.94, 1.06]
    min_dropbacks: 20

ensemble:
  enabled: true
  ff_opportunity:
    enabled: true
    cache_dir: null
    positions: [QB, RB, WR, TE]
    feature: total_fantasy_points_exp
    weights:
      QB: 0.35
      RB: 0.15
      WR: 0.25
      TE: 0.15
    min_coverage_weeks: 1
    prior_width:  # KS-13 D-10 (Plan 07 enables; Path A or Path B per probe)
      enabled: false
  ff_rankings:
    enabled: false
  dynamic_blend:
    enabled: true
    weights_dir: null
    week_buckets: ["1-4", "5-12", "13-18"]
    min_bucket_rows: 200
    min_bucket_weeks: 6
    grid_step: 0.05
    fallback: fixed_defaults
    simulator_weight_floor: 0.0  # KS-08 D-06 placeholder (Plan 02 retunes to smallest-passing value from sweep {0.20, 0.30, 0.40})
  residual_calibration:
    enabled: true
    artifacts_dir: null
    positions: [QB, RB, WR, TE]
    min_bucket_rows: 200
    min_bucket_weeks: 6
    shrinkage_prior_rows: 200
    max_abs_adjustment: 1.5
    min_training_mae_delta: -0.01
    fallback: zero
    max_abs_adjustment_by_position:  # KS-10 D-07 placeholder (Plan 05 retunes to {QB: 2.5, RB: 2.0, WR: 1.5, TE: 0.8})
      QB: 1.5
      RB: 1.5
      WR: 1.5
      TE: 1.5
    stat_level:  # KS-09 D-03 (Plan 03 enables + uses) — SHIPPED-PARTIAL 2026-04-27
      enabled: true
      covered_stats:
        - pass_yards
        - pass_tds
        - interceptions
        - rush_yards
        - rush_tds
        - receiving_yards
        - receptions
        - receiving_tds
        - fumbles_lost

market_history:
  enabled: true
  data_dir: null
  snapshot_label: close_core8
  positions: [QB, RB, WR, TE]
  weights:
    QB: 0.20
    RB: 0.15
    WR: 0.20
    TE: 0.15
  min_coverage_weeks: 1
  min_books: 2
  dispersion_scale: 3.0
  features:
    close_fpts: true
    open_fpts: true
    movement: true
    dispersion: true
    anytime_td: true

availability:
  enabled: true
  positions: [QB, RB, WR, TE]
  injuries:
    enabled: false
    hard_out_statuses: [Out, Doubtful, Suspended, Injured Reserve]
    limited_statuses: [Questionable]
    limited_factor: 0.75
  depth_charts:
    enabled: true
    starter_slots:
      QB: QB1
      RB: RB1
      WR: WR1
      TE: TE1
  usage_fallback:
    enabled: true
    lookback_weeks: 3
    min_factor: 0.85
    qb_low_usage_factor: 0.92
    rb_low_usage_factor: 0.90
    wr_low_usage_factor: 0.92
    te_low_usage_factor: 0.92

role_trend:
  enabled: false
  positions: [QB, RB, WR, TE]
  window_weeks: 3
  factor_clamp: [0.90, 1.10]
  qb:
    sensitivity: 0.12
  rb:
    sensitivity: 0.10
  wr:
    sensitivity: 0.10
  te:
    sensitivity: 0.08

game_script:
  enabled: true
  trailing_late:
    enabled: true
    deficit_threshold: 8
    final_five_minutes: 300
    final_five_deficit_threshold: 4
    pass_rate_prior_strength: 250
    pace_prior_strength: 250
    target_prior_strength: 80
    pass_rate_clamp: [1.00, 1.35]
    pace_factor_clamp: [1.00, 1.20]
    target_rank_factor_clamp: [0.85, 1.25]
  leading_late_rb:
    enabled: false
    lead_threshold: 14
    late_minutes: 600
    rb_carry_prior_strength: 100
    rb_rank_factor_clamp: [0.85, 1.15]

goal_line_concentration:
  enabled: false

td_tendency:
  enabled: true              # flip to true after A/B validation
  prior_strength: 20          # pseudo-opportunities for Bayesian shrinkage
  min_opportunities: 5        # minimum RZ targets/carries to compute factor
  factor_clamp: [0.65, 1.35]  # prevent extreme gate modifications
  i5_enabled: true             # flip after A/B validation
  i5_prior_strength: 25
  i5_min_opportunities: 3
