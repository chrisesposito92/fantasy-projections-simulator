[project]
name = "fantasy-sim"
version = "0.1.0"
description = "NFL fantasy football projections via play-by-play simulation"
requires-python = ">=3.12"
dependencies = [
    "nflreadpy>=0.1.0",
    "polars>=1.0.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
    "thefuzz>=0.22.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "hypothesis>=6.0",
]

[project.scripts]
fantasy-sim = "fantasy_sim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fantasy_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that call nflreadpy (slow, requires network)",
    "statistical: tests that run bulk simulations (slow)",
]
